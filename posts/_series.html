<!-- Shell for a markdown series, filled in by build.py.

     The body placeholder below is replaced with every post in the
     series, one section each. Edit this file to change the chrome
     around all of them at once; edit the markdown in posts/ to change
     what they say. Do not write a placeholder name inside a comment —
     substitution is a plain text replace and would fill that in too. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" type="image/png" href="/assets/img/logo_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/post.css">
</head>
<body>


<header class="bar"><div class="bar-in"><span class="bar-nav"><a class="back" href="/#algorithms">Algorithms</a><span class="sep">/</span><a class="here" href="#index">{{series}}</a></span><span class="part" id="partLabel">{{parts_label}}</span></div></header>

<main>

{{body}}

</main>

<script>
(function(){
  var pages = Array.prototype.slice.call(document.querySelectorAll('[data-page]'));
  var label = document.getElementById('partLabel');
  function show(scroll){
    var id = (location.hash || '#index').slice(1);
    var target = document.getElementById(id);
    if (!target || !target.hasAttribute('data-page')) target = pages[0];
    pages.forEach(function(p){ p.hidden = (p !== target); });
    label.textContent = target.getAttribute('data-part');
    if (scroll) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', function(){ show(true); });
  show(false);
})();
</script>

</body>
</html>
